<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meadow — See Yourself Clearly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#faf9f7',
              sage: {
                50: '#f4f7f5',
                100: '#e3ebe6',
                200: '#c5d8cf',
                300: '#9ebcae',
                400: '#7fa08d',
                500: '#6B8F7A', // Primary
                600: '#5a7a68',
                700: '#4a6355',
                800: '#3e5146',
                900: '#34433b',
              },
              surface: {
                DEFAULT: 'rgba(255, 255, 255, 0.75)',
                hover: 'rgba(255, 255, 255, 0.9)',
                active: '#ffffff',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Fraunces', 'serif'],
            },
            animation: {
              'fade-up': 'fadeUp 0.6s ease-out forwards',
              'fade-in': 'fadeIn 0.4s ease-out forwards',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(107, 143, 122, 0.2); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(107, 143, 122, 0.35); }
      
      /* Hide scrollbar for clean UI but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
