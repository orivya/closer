<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORIVYA — See Yourself Clearly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Fraunces', 'serif'],
            },
            colors: {
              sage: {
                DEFAULT: '#7d9b8a',
                light: '#a8c5b5',
                dark: '#546e60',
                glow: 'rgba(125, 155, 138, 0.3)',
                subtle: 'rgba(125, 155, 138, 0.1)',
                muted: 'rgba(125, 155, 138, 0.2)',
              },
              bg: {
                base: '#030304',
                elevated: '#0a0a0c',
                surface: '#121214',
                glass: 'rgba(255, 255, 255, 0.03)',
              },
              text: {
                primary: '#f2f2f2',
                secondary: '#a1a1aa',
                tertiary: '#52525b',
                muted: '#3f3f46',
              },
              border: {
                subtle: 'rgba(255, 255, 255, 0.03)',
                default: 'rgba(255, 255, 255, 0.06)',
                highlight: 'rgba(255, 255, 255, 0.12)',
              },
              // Functional Colors for Spaces (Adapted for Dark Mode)
              func: {
                coral: '#f87171',
                coralSubtle: 'rgba(248, 113, 113, 0.15)',
                blue: '#60a5fa',
                blueSubtle: 'rgba(96, 165, 250, 0.15)',
                purple: '#a78bfa',
                purpleSubtle: 'rgba(167, 139, 250, 0.15)',
                amber: '#fbbf24',
                amberSubtle: 'rgba(251, 191, 36, 0.15)',
              },
              // GitHub Theme Colors
              github: {
                dark: '#0d1117',
                panel: '#161b22',
                border: '#30363d',
                text: '#c9d1d9',
                accent: '#58a6ff',
                success: '#238636',
                danger: '#da3633',
                warning: '#d29922',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'draw-stroke': 'drawStroke 2s ease-out forwards',
              'scroll-bounce': 'scrollBounce 2.5s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              drawStroke: {
                to: { strokeDashoffset: '0' }
              },
              scrollBounce: {
                '0%, 100%': { transform: 'translateY(0)', opacity: '0.5' },
                '50%': { transform: 'translateY(8px)', opacity: '1' },
              }
            },
            backgroundImage: {
               'gradient-surface': 'linear-gradient(to bottom right, rgba(255,255,255,0.03), rgba(0,0,0,0))',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #030304;
        color: #f2f2f2;
        overflow-x: hidden;
      }
      
      ::selection {
        background: rgba(125, 155, 138, 0.3);
        color: white;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030304;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      
      .glass-nav {
        background: rgba(3, 3, 4, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }

      .glass-card {
        background: rgba(18, 18, 20, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      
      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      
      .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      .text-balance {
        text-wrap: balance;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
