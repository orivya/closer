    <title>Meadow — See Yourself Clearly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                DEFAULT: '#7d9b8a',
                light: '#9bb3a7',
                dark: '#5c7a6b',
                subtle: 'rgba(125, 155, 138, 0.08)',
                glow: 'rgba(125, 155, 138, 0.5)',
                muted: '#94a39d',
              },
              clay: {
                DEFAULT: '#c47f6a',
                light: '#e8927c',
                subtle: 'rgba(196, 127, 106, 0.1)',
              },
              stone: {
                50: '#faf9f7',
                100: '#f5f3f0',
                200: '#e8e6e3',
                300: '#d6d3d0',
                800: '#44403c',
                900: '#292524',
              },
              text: {
                primary: '#1c2421', /* Darker for better contrast */
                secondary: '#4a5753', /* Darker gray for readability */
                tertiary: '#8b9b96',
                muted: '#94a39d',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Fraunces', 'serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'noise': "url('data:image/svg+xml,%3Csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"noiseFilter\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.8\" numOctaves=\"3\" stitchTiles=\"stitch\"/%3E%3C/filter%3E%3Crect width=\"100%25\" height=\"100%25\" filter=\"url(%23noiseFilter)\" opacity=\"0.5\"/%3E%3C/svg%3E')",
            },
            animation: {
              'fade-up': 'fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 1.2s ease-out forwards',
              'scale-in': 'scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-slow': 'pulseSlow 8s ease-in-out infinite',
              'float': 'float 10s ease-in-out infinite',
              'ripple': 'ripple 4s cubic-bezier(0, 0, 0.2, 1) infinite',
              'grain': 'grain 8s steps(10) infinite',
              'draw-stroke': 'drawStroke 2.5s ease-out forwards',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
                '50%': { opacity: '0.6', transform: 'scale(1.1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              ripple: {
                 '0%': { transform: 'scale(0.8)', opacity: '0.5', borderWidth: '1px' },
                 '100%': { transform: 'scale(2.5)', opacity: '0', borderWidth: '0px' },
              },
              drawStroke: {
                '0%': { strokeDashoffset: '500' },
                '100%': { strokeDashoffset: '0' },
              },
              grain: {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '10%': { transform: 'translate(-5%, -10%)' },
                '20%': { transform: 'translate(-15%, 5%)' },
                '30%': { transform: 'translate(7%, -25%)' },
                '40%': { transform: 'translate(-5%, 25%)' },
                '50%': { transform: 'translate(-15%, 10%)' },
                '60%': { transform: 'translate(15%, 0%)' },
                '70%': { transform: 'translate(0%, 15%)' },
                '80%': { transform: 'translate(3%, 35%)' },
                '90%': { transform: 'translate(-10%, 10%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #faf9f7;
        color: #1c2421;
        -webkit-font-smoothing: antialiased;

        overflow-x: hidden;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .glass-nav {
        background: rgba(250, 249, 247, 0.85);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(125, 155, 138, 0.1);
      }
      
      /* Smooth fade for gradients */
      .fade-mask {
        mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
      }
    </style>
