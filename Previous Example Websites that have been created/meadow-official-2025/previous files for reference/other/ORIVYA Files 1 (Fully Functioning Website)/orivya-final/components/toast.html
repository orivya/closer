<!-- ===========================================
   ORIVYA COMPONENT: Toast
   
   Confirmation messages and notifications that
   appear and auto-dismiss.
   
   Used throughout the app for: save confirmations,
   actions feedback, error messages.
   =========================================== -->

<style>
/* ===========================================
   TOAST CONTAINER
   =========================================== */
.toast-container {
  position: fixed;
  bottom: calc(var(--tab-bar-height) + var(--safe-area-bottom) + var(--space-4));
  left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  pointer-events: none;
}

@media (min-width: 1024px) {
  .toast-container {
    bottom: var(--space-6);
  }
}

/* ===========================================
   TOAST - Base Style
   =========================================== */
.toast {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
  
  /* Animation */
  animation: toastEnter 300ms ease-out forwards;
}

.toast.is-exiting {
  animation: toastExit 200ms ease-in forwards;
}

/* Toast Icon */
.toast-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

/* Toast Message */
.toast-message {
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--text-primary);
  white-space: nowrap;
}

/* Toast Action (Undo button) */
.toast-action {
  padding: var(--space-1) var(--space-2);
  font-size: var(--text-xs);
  font-weight: var(--font-semibold);
  color: var(--sage);
  background-color: transparent;
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
  margin-left: var(--space-2);
}

.toast-action:hover {
  background-color: var(--sage-subtle);
}

/* Toast Close */
.toast-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
  margin-left: var(--space-1);
}

.toast-close:hover {
  background-color: var(--bg-hover);
  color: var(--text-secondary);
}

.toast-close svg {
  width: 14px;
  height: 14px;
}

/* ===========================================
   TOAST VARIANTS
   =========================================== */

/* Success Toast */
.toast--success .toast-icon {
  color: var(--success);
}

/* Error Toast */
.toast--error {
  border-color: var(--error-subtle);
}

.toast--error .toast-icon {
  color: var(--error);
}

/* Warning Toast */
.toast--warning {
  border-color: var(--warning-subtle);
}

.toast--warning .toast-icon {
  color: var(--warning);
}

/* Info Toast */
.toast--info .toast-icon {
  color: var(--info);
}

/* ===========================================
   TOAST ANIMATIONS
   =========================================== */
@keyframes toastEnter {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes toastExit {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
  }
}

/* ===========================================
   TOAST - Minimal Variant
   Just the message, no icon or close
   =========================================== */
.toast--minimal {
  padding: var(--space-2) var(--space-4);
}

.toast--minimal .toast-icon,
.toast--minimal .toast-close {
  display: none;
}
</style>

<!-- Toast Container (place in body) -->
<div class="toast-container" id="toastContainer"></div>

<!-- Toast Examples -->

<!-- Success Toast -->
<div class="toast toast--success">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span class="toast-message">Saved.</span>
</div>

<!-- Success Toast with Special Message -->
<div class="toast toast--success">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span class="toast-message">First entry. This is the beginning.</span>
</div>

<!-- Toast with Undo Action -->
<div class="toast toast--success">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"/>
    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
  </svg>
  <span class="toast-message">Deleted.</span>
  <button class="toast-action" onclick="handleUndo()">Undo</button>
</div>

<!-- Error Toast -->
<div class="toast toast--error">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <line x1="15" y1="9" x2="9" y2="15"/>
    <line x1="9" y1="9" x2="15" y2="15"/>
  </svg>
  <span class="toast-message">Couldn't save. Try again.</span>
  <button class="toast-close" onclick="dismissToast(this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<!-- Minimal Toast -->
<div class="toast toast--minimal toast--success">
  <span class="toast-message">Saved.</span>
</div>

<script>
/**
 * Toast Controller
 * 
 * Manages toast notifications throughout the app.
 */
const Toast = {
  container: null,
  queue: [],
  defaultDuration: 3000,
  
  init() {
    this.container = document.getElementById('toastContainer');
  },
  
  /**
   * Show a toast notification
   * @param {Object} options - Toast options
   * @param {string} options.message - Toast message
   * @param {string} options.type - Type: 'success', 'error', 'warning', 'info'
   * @param {number} options.duration - Duration in ms (0 for persistent)
   * @param {string} options.action - Action button text (optional)
   * @param {Function} options.onAction - Action callback (optional)
   */
  show({ message, type = 'success', duration = this.defaultDuration, action = null, onAction = null }) {
    if (!this.container) this.init();
    
    const toast = document.createElement('div');
    toast.className = `toast toast--${type}`;
    
    // Icon based on type
    const icons = {
      success: '<polyline points="20 6 9 17 4 12"/>',
      error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      warning: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
    };
    
    toast.innerHTML = `
      <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        ${icons[type]}
      </svg>
      <span class="toast-message">${message}</span>
      ${action ? `<button class="toast-action">${action}</button>` : ''}
    `;
    
    // Add action handler
    if (action && onAction) {
      toast.querySelector('.toast-action').addEventListener('click', () => {
        onAction();
        this.dismiss(toast);
      });
    }
    
    this.container.appendChild(toast);
    
    // Auto-dismiss
    if (duration > 0) {
      setTimeout(() => this.dismiss(toast), duration);
    }
    
    return toast;
  },
  
  dismiss(toast) {
    toast.classList.add('is-exiting');
    setTimeout(() => toast.remove(), 200);
  },
  
  // Convenience methods
  success(message, duration) {
    return this.show({ message, type: 'success', duration });
  },
  
  error(message, duration = 5000) {
    return this.show({ message, type: 'error', duration });
  },
  
  warning(message, duration) {
    return this.show({ message, type: 'warning', duration });
  },
  
  info(message, duration) {
    return this.show({ message, type: 'info', duration });
  },
  
  // Special messages matching the content system
  saved() {
    return this.success('Saved.');
  },
  
  firstEntry() {
    return this.success('First entry. This is the beginning.');
  },
  
  deepEntry() {
    return this.success('Saved. You went deep.');
  },
  
  archived() {
    return this.success('Archived.');
  },
  
  deleted(onUndo) {
    return this.show({
      message: 'Deleted.',
      type: 'success',
      action: 'Undo',
      onAction: onUndo,
      duration: 5000
    });
  },
  
  restored() {
    return this.success('Restored.');
  },
  
  threadCreated() {
    return this.success('Thread created.');
  },
  
  goalAdded() {
    return this.success('Goal added.');
  },
  
  goalResolved() {
    return this.success('Goal resolved. That\'s worth acknowledging.');
  },
  
  saveFailed() {
    return this.error('Couldn\'t save. Try again.');
  }
};

// Initialize on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  Toast.init();
});

// Helper functions for inline onclick
function dismissToast(closeBtn) {
  const toast = closeBtn.closest('.toast');
  Toast.dismiss(toast);
}

function handleUndo() {
  console.log('Undo action');
}

// Example usage:
// Toast.saved();
// Toast.deleted(() => console.log('Undoing delete'));
// Toast.error('Something went wrong');
</script>
