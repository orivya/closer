<!-- ===========================================
   ORIVYA COMPONENT: Prompt Card
   
   Displays a writing prompt with option to
   start writing or skip to another prompt.
   
   Used on: Homepage (Featured Prompt), Guided Flow
   =========================================== -->

<style>
/* ===========================================
   PROMPT CARD - Featured (Homepage)
   =========================================== */
.prompt-card {
  display: flex;
  flex-direction: column;
  padding: var(--space-6);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  transition: all var(--transition-fast);
}

.prompt-card:hover {
  border-color: var(--border-default);
}

/* Prompt Header */
.prompt-card-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.prompt-card-icon {
  width: 20px;
  height: 20px;
  color: var(--sage);
}

.prompt-card-label {
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  color: var(--sage);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Prompt Text */
.prompt-card-text {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: var(--font-normal);
  color: var(--text-primary);
  line-height: 1.5;
  margin-bottom: var(--space-5);
}

@media (min-width: 768px) {
  .prompt-card-text {
    font-size: var(--text-2xl);
  }
}

/* Prompt Actions */
.prompt-card-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.prompt-card-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
}

.prompt-card-btn--primary {
  background-color: var(--sage);
  color: white;
}

.prompt-card-btn--primary:hover {
  background-color: var(--sage-dark);
  box-shadow: var(--shadow-glow);
}

.prompt-card-btn--secondary {
  background-color: transparent;
  color: var(--text-tertiary);
}

.prompt-card-btn--secondary:hover {
  background-color: var(--bg-hover);
  color: var(--text-secondary);
}

.prompt-card-btn svg {
  width: 16px;
  height: 16px;
}

/* ===========================================
   PROMPT CARD - Compact (Guided Flow)
   =========================================== */
.prompt-card--compact {
  padding: var(--space-4);
}

.prompt-card--compact .prompt-card-text {
  font-size: var(--text-lg);
  margin-bottom: var(--space-4);
}

/* ===========================================
   PROMPT CARD - Selectable (Prompt Library)
   =========================================== */
.prompt-card--selectable {
  cursor: pointer;
  padding: var(--space-4);
}

.prompt-card--selectable:hover {
  background-color: var(--bg-hover);
}

.prompt-card--selectable.is-selected {
  background-color: var(--sage-subtle);
  border-color: var(--sage-muted);
}

.prompt-card--selectable .prompt-card-header {
  margin-bottom: var(--space-2);
}

.prompt-card--selectable .prompt-card-text {
  font-family: var(--font-body);
  font-size: var(--text-base);
  margin-bottom: 0;
}

.prompt-card--selectable .prompt-card-actions {
  display: none;
}

/* ===========================================
   PROMPT LIST
   =========================================== */
.prompt-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* ===========================================
   PROMPT CATEGORY CARD
   For prompt library category selection
   =========================================== */
.prompt-category-card {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.prompt-category-card:hover {
  background-color: var(--bg-hover);
  border-color: var(--border-default);
}

.prompt-category-card.is-selected {
  background-color: var(--sage-subtle);
  border-color: var(--sage-muted);
}

.prompt-category-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg-surface-2);
  border-radius: var(--radius-md);
  flex-shrink: 0;
}

.prompt-category-card:hover .prompt-category-icon,
.prompt-category-card.is-selected .prompt-category-icon {
  background-color: var(--sage-subtle);
}

.prompt-category-icon svg {
  width: 20px;
  height: 20px;
  color: var(--text-secondary);
}

.prompt-category-card:hover .prompt-category-icon svg,
.prompt-category-card.is-selected .prompt-category-icon svg {
  color: var(--sage);
}

.prompt-category-content {
  flex: 1;
  min-width: 0;
}

.prompt-category-title {
  font-size: var(--text-base);
  font-weight: var(--font-medium);
  color: var(--text-primary);
  margin-bottom: var(--space-1);
}

.prompt-category-count {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

.prompt-category-arrow {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  opacity: 0;
  transform: translateX(-4px);
  transition: all var(--transition-fast);
}

.prompt-category-card:hover .prompt-category-arrow {
  opacity: 1;
  transform: translateX(0);
}
</style>
