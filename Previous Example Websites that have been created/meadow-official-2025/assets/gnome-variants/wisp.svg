<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse-float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.9; }
      50% { transform: translateY(-10px) scale(1.05); opacity: 1; }
    }
    @keyframes particle-move {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    .wisp-body { transform-origin: center; animation: pulse-float 4s ease-in-out infinite; }
    .eyes { transform-origin: center; animation: blink 5s infinite; }
    .p1 { animation: particle-move 2s linear infinite; }
    .p2 { animation: particle-move 2.5s linear infinite 0.5s; }
    .p3 { animation: particle-move 3s linear infinite 1s; }
  </style>

  <!-- Glow -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="100%" stop-color="#81D4FA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="60" fill="url(#glow)" opacity="0.4" class="wisp-body"/>

  <g class="wisp-body">
    <!-- Core Body -->
    <circle cx="100" cy="100" r="30" fill="#B3E5FC" />

    <!-- Eyes -->
    <g class="eyes">
      <circle cx="90" cy="98" r="4" fill="#01579B" />
      <circle cx="110" cy="98" r="4" fill="#01579B" />
      <!-- Highlights -->
      <circle cx="92" cy="96" r="1.5" fill="white" />
      <circle cx="112" cy="96" r="1.5" fill="white" />
    </g>
  </g>

  <!-- Particles -->
  <circle cx="80" cy="120" r="2" fill="#B3E5FC" class="p1" />
  <circle cx="120" cy="130" r="1.5" fill="#B3E5FC" class="p2" />
  <circle cx="100" cy="140" r="2" fill="#B3E5FC" class="p3" />
</svg>
