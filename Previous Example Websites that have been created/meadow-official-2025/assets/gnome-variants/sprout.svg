<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .leaf-hat { transform-origin: 100px 85px; animation: sway 3s ease-in-out infinite; }
    .body { animation: bounce 2s ease-in-out infinite; }
  </style>

  <g class="body">
    <!-- Legs -->
    <path d="M90 140 L 90 160" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
    <path d="M110 140 L 110 160" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>

    <!-- Body (Seed) -->
    <ellipse cx="100" cy="120" rx="25" ry="30" fill="#D7CCC8" />

    <!-- Face -->
    <circle cx="92" cy="115" r="2.5" fill="#3E2723" />
    <circle cx="108" cy="115" r="2.5" fill="#3E2723" />
    <path d="M98 122 Q 100 124 102 122" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Leaf Hat -->
    <g class="leaf-hat">
      <path d="M100 90 Q 60 80 40 110 Q 50 60 100 90 Z" fill="#81C784" />
      <path d="M100 90 Q 140 80 160 110 Q 150 60 100 90 Z" fill="#66BB6A" />
      <path d="M100 90 L 100 60" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Shadow -->
  <ellipse cx="100" cy="165" rx="15" ry="4" fill="black" opacity="0.1" />
</svg>
