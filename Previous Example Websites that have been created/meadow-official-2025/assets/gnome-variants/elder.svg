<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float-elder {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .elder-figure { animation: float-elder 5s ease-in-out infinite; }
  </style>

  <g class="elder-figure">
    <!-- Hat -->
    <path d="M100 40 L 70 110 H 130 L 100 40 Z" fill="#455A64" />
    <ellipse cx="100" cy="110" rx="35" ry="5" fill="#37474F" />

    <!-- Beard -->
    <path d="M75 110 Q 100 180 125 110" fill="#ECEFF1" />

    <!-- Robe/Body (Hidden/Simple) -->
    <path d="M80 110 L 70 170 H 130 L 120 110" fill="#546E7A" opacity="0.8"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="100" cy="180" rx="20" ry="3" fill="black" opacity="0.1" />
</svg>
